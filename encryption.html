<!DOCTYPE html>

    <style>
        /* (same styles as before – kept for brevity) */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root { --bg:#0d0717; --surface:#1a0f2a; --card:#25163a; --border:#3d235a; --primary:#b886ff; --primary-dim:#7a4bb5; --gold:#f0c060; --gold-dim:#b8943a; --text:#f0e8ff; --text-muted:#b8a8d8; --success:#6bdb8a; --danger:#ff7a7a; --radius:16px; --shadow:0 8px 32px rgba(0,0,0,0.6); }

        .header::after { content:"✦"; position:absolute; right:16px; top:12px; font-size:20px; color:var(--gold); opacity:0.3; }

        .header .badge { display:inline-block; background:rgba(184,134,255,0.15); border:1px solid rgba(184,134,255,0.2); border-radius:20px; padding:2px 14px; font-size:0.6rem; color:var(--primary); margin-top:6px; letter-spacing:0.5px; }

        .progress-bar .fill { height:100%; width:0%; background:linear-gradient(90deg, var(--primary-dim), var(--gold)); border-radius:20px; transition:width 0.25s ease; }
        .progress-label { display:flex; justify-content:space-between; font-size:0.7rem; color:var(--text-muted); margin-top:4px; }
        .current-file { font-size:0.75rem; color:var(--text-muted); padding:6px 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:1.4em; }

        .status-log::-webkit-scrollbar { width:4px; }

        .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 18px; border-radius:12px; border:none; font-size:0.85rem; font-weight:600; cursor:pointer; transition:all 0.2s ease; color:#fff; background:var(--card); border:1px solid var(--border); touch-action:manipulation; user-select:none; text-align:center; min-height:50px; line-height:1.2; position:relative; }

        .btn-gold { background:linear-gradient(145deg, #b8943a, #8a6d2a); border-color:var(--gold); color:#fff; }

        .btn-outline { background:transparent; border-color:var(--border); color:var(--text-muted); }

        .btn .icon { font-size:1.1rem; }
        #folderInput, #fileInput { display:none; }

        .file-list-wrap::-webkit-scrollbar { width:4px; }
        .file-list-wrap::-webkit-scrollbar-track { background:transparent; }
        .file-list-wrap::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

        .file-item:last-child { border-bottom:none; }
        .file-item .name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .file-item .status-icon { font-size:0.7rem; width:18px; text-align:center; flex-shrink:0; }
        .file-item .status-icon.ok { color:var(--success); }
        .file-item .status-icon.fail { color:var(--danger); }
        .file-item .status-icon.wait { color:var(--text-muted); }
        @media (max-width:420px) { .stats { grid-template-columns:1fr 1fr; gap:6px; } .stat-item .num { font-size:1.2rem; } .header h1 { font-size:1.3rem; } .btn { font-size:0.75rem; padding:10px 12px; min-height:44px; } .btn-group { gap:6px; } .btn-group .btn { min-width:60px; } }
        @media (max-width:360px) { .stat-item .num { font-size:1rem; } .stat-item .label { font-size:0.5rem; } .header h1 { font-size:1.1rem; } }
        .mt-1 { margin-top:6px; }
        .mt-2 { margin-top:12px; }
        .mb-1 { margin-bottom:6px; }
        .flex { display:flex; align-items:center; gap:8px; }
        .text-muted { color:var(--text-muted); }
        .text-sm { font-size:0.75rem; }
        .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--card); border:1px solid var(--border); padding:12px 24px; border-radius:14px; font-size:0.85rem; color:var(--text); box-shadow:var(--shadow); opacity:0; transition:all 0.4s ease; max-width:90%; text-align:center; pointer-events:none; z-index:999; backdrop-filter:blur(8px); }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .toast.success { border-color:var(--success); }
        .toast.error { border-color:var(--danger); }
        .spinner { display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,0.1); border-top-color:var(--gold); border-radius:50%; animation:spin 0.7s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .btn .spinner { width:16px; height:16px; border-width:2px; }
        .pill { display:inline-block; padding:2px 10px; border-radius:20px; font-size:0.6rem; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; background:var(--card); border:1px solid var(--border); color:var(--text-muted); }
        .pill.gold { border-color:var(--gold); color:var(--gold); background:rgba(240,192,96,0.08); }
    </style>
</head>
<body>

    <div class="app" id="app">
        <div class="header">
            <div class="sub">✦ Jinendra Vani</div>
            <h1>Content Encryption</h1>
            <div class="tag">Offline · AES-256-GCM · Android Assets</div>
            <div class="badge">🔒 assets/p/ · .dat</div>
        </div>

        <div class="card">
            <div class="card-title">📊 Summary</div>
            <div class="stats">
                <div class="stat-item"><div class="num" id="statFound">0</div><div class="label">Found</div></div>
                <div class="stat-item"><div class="num gold" id="statEncrypted">0</div><div class="label">Encrypted</div></div>

        <div class="card">

                <button class="btn btn-primary" id="btnSelectFolder"><span class="icon">📂</span> Select Folder</button>

            </div>

            </div>

        <div style="text-align:center;font-size:0.6rem;color:var(--text-muted);padding:20px 0 8px;opacity:0.5;letter-spacing:0.5px;">

    <div class="toast" id="toast"></div>

    <input type="file" id="folderInput" webkitdirectory multiple />
    <input type="file" id="fileInput" multiple accept=".txt,.json" />

    <script>
        (function() {
            'use strict';

            // ─── CONSTANTS ──────────────────────────────────────────────
            const SECRET = '32JHi3Juwpih9Fdq72tNsfaFYlLtUsi5IwlAqf8VmfNXgbr8E5A2AsqcJJEqQchWdtGTGAf2ENRWqTl+';
            const IV_LEN = 12;
            const ALGO = 'AES-GCM';

            // ─── DOM REFS ──────────────────────────────────────────────
            const $ = id => document.getElementById(id);
            const statFound = $('statFound');
            const statEncrypted = $('statEncrypted');
            const statFailed = $('statFailed');
            const statSize = $('statSize');
            const progressFill = $('progressFill');
            const progressText = $('progressText');
            const progressPct = $('progressPct');
            const currentFile = $('currentFile');
            const statusLog = $('statusLog');
            const btnSelectFolder = $('btnSelectFolder');
            const btnSelectFiles = $('btnSelectFiles');
            const btnEncrypt = $('btnEncrypt');
            const btnDownload = $('btnDownload');
            const btnClear = $('btnClear');
            const btnVerify = $('btnVerify');
            const folderInput = $('folderInput');
            const fileInput = $('fileInput');
            const fileListWrap = $('fileListWrap');
            const fileListCard = $('fileListCard');
            const fileListPill = $('fileListPill');
            const fileCountLabel = $('fileCountLabel');
            const toast = $('toast');

            // ─── STATE ──────────────────────────────────────────────────
            let state = {
                files: [], // { file: File, relPath: string, size: number, encrypted: null|Uint8Array, status: 'wait'|'ok'|'fail' }
                key: null,
                keyRaw: null,
                isEncrypting: false,
                encryptedCount: 0,
                failedCount: 0,
            };

            // ─── TOAST & LOG ──────────────────────────────────────────
            let toastTimer = null;

            function showToast(msg, type) {
                if (toastTimer) { clearTimeout(toastTimer);
                    toastTimer = null; }
                toast.textContent = msg;
                toast.className = 'toast' + (type ? ' ' + type : '');
                void toast.offsetWidth;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 2800);
            }

            function log(msg, cls) {
                const entry = document.createElement('div');
                entry.className = 'log-entry' + (cls ? ' ' + cls : '');
                entry.textContent = msg;
                statusLog.appendChild(entry);
                statusLog.scrollTop = statusLog.scrollHeight;
                while (statusLog.children.length > 200) statusLog.removeChild(statusLog.firstChild);
            }

            // ─── ZIP GENERATION ──────────────────────────────────────
            function crc32(data) {
                let crc = 0xFFFFFFFF;
                const view = data instanceof Uint8Array ? data : new Uint8Array(data);
                for (let i = 0; i < view.length; i++) {
                    crc ^= view[i];
                    for (let j = 0; j < 8; j++) {
                        if (crc & 1) crc = (crc >>> 1) ^ 0xEDB88320;
                        else crc = crc >>> 1;
                    }
                }
                return (crc ^ 0xFFFFFFFF) >>> 0;
            }

            function dosDateTime(ts) {
                const d = ts ? new Date(ts) : new Date();
                const year = d.getFullYear();
                const month = d.getMonth() + 1;
                const day = d.getDate();
                const hours = d.getHours();
                const mins = d.getMinutes();
                const secs = d.getSeconds();
                const dt = ((year - 1980) << 9) | (month << 5) | day;
                const tm = (hours << 11) | (mins << 5) | (secs >> 1);
                return [dt & 0xFFFF, tm & 0xFFFF];
            }

            function generateZip(files) {
                const entries = [];
                let offset = 0;
                for (const f of files) {
                    const name = f.path.replace(/\\/g, '/');
                    const nameBytes = new TextEncoder().encode(name);
                    const data = f.data;
                    const crc = crc32(data);
                    const [modDate, modTime] = dosDateTime(Date.now());
                    const compSize = data.length;
                    const uncompSize = data.length;
                    const lfh = new Uint8Array(30 + nameBytes.length);
                    let pos = 0;
                    const w32 = (v) => { lfh[pos++] = v & 0xFF;
                        lfh[pos++] = (v >> 8) & 0xFF;
                        lfh[pos++] = (v >> 16) & 0xFF;
                        lfh[pos++] = (v >> 24) & 0xFF; };
                    const w16 = (v) => { lfh[pos++] = v & 0xFF;
                        lfh[pos++] = (v >> 8) & 0xFF; };
                    w32(0x04034b50);
                    w16(0x0314);
                    w16(0x0800);
                    w16(0x0000);
                    w16(modTime);
                    w16(modDate);
                    w32(crc);
                    w32(compSize);
                    w32(uncompSize);
                    w16(nameBytes.length);
                    w16(0x0000);
                    lfh.set(nameBytes, pos);
                    const lfhSize = 30 + nameBytes.length;
                    entries.push({ lfh, data, lfhSize, dataSize: data.length, nameBytes, crc, modTime, modDate });
                    offset += lfhSize + data.length;
                }
                const cdEntries = [];
                let cdSize = 0;
                let dataOffset = 0;
                for (const e of entries) {
                    const nameLen = e.nameBytes.length;
                    const cen = new Uint8Array(46 + nameLen);
                    let pos = 0;
                    const w32 = (v) => { cen[pos++] = v & 0xFF;
                        cen[pos++] = (v >> 8) & 0xFF;
                        cen[pos++] = (v >> 16) & 0xFF;
                        cen[pos++] = (v >> 24) & 0xFF; };
                    const w16 = (v) => { cen[pos++] = v & 0xFF;
                        cen[pos++] = (v >> 8) & 0xFF; };
                    w32(0x02014b50);
                    w16(0x0314);
                    w16(0x0314);
                    w16(0x0800);
                    w16(0x0000);
                    w16(e.modTime);
                    w16(e.modDate);
                    w32(e.crc);
                    w32(e.dataSize);
                    w32(e.dataSize);
                    w16(nameLen);
                    w16(0x0000);
                    w16(0x0000);
                    w16(0x0000);
                    w16(0x0000);
                    w32(0x00000000);
                    w32(dataOffset);
                    cen.set(e.nameBytes, pos);
                    cdEntries.push(cen);
                    cdSize += cen.length;
                    dataOffset += e.lfhSize + e.dataSize;
                }
                const totalSize = offset + cdSize + 22;
                const result = new Uint8Array(totalSize);
                let writePos = 0;
                for (const e of entries) {
                    result.set(e.lfh, writePos);
                    writePos += e.lfhSize;
                    result.set(e.data, writePos);
                    writePos += e.dataSize;
                }
                for (const cd of cdEntries) {
                    result.set(cd, writePos);
                    writePos += cd.length;
                }
                const eocd = new Uint8Array(22);
                let ep = 0;
                const ew32 = (v) => { eocd[ep++] = v & 0xFF;
                    eocd[ep++] = (v >> 8) & 0xFF;
                    eocd[ep++] = (v >> 16) & 0xFF;
                    eocd[ep++] = (v >> 24) & 0xFF; };
                const ew16 = (v) => { eocd[ep++] = v & 0xFF;
                    eocd[ep++] = (v >> 8) & 0xFF; };
                ew32(0x06054b50);
                ew16(0x0000);
                ew16(0x0000);
                ew16(entries.length);
                ew16(entries.length);
                ew32(cdSize);
                ew32(offset);
                ew16(0x0000);
                result.set(eocd, writePos);
                return result;
            }

            // ─── KEY DERIVATION ──────────────────────────────────────
            async function deriveKey() {
                const encoder = new TextEncoder();
                const hash = await crypto.subtle.digest('SHA-256', encoder.encode(SECRET));
                return hash;
            }

            async function getCryptoKey() {
                if (state.key) return state.key;
                const raw = await deriveKey();
                state.keyRaw = raw;
                const key = await crypto.subtle.importKey('raw', raw, { name: ALGO }, false, ['encrypt', 'decrypt']);
                state.key = key;
                return key;
            }

            // ─── ENCRYPT / DECRYPT ──────────────────────────────────
            async function encryptFile(key, data) {
                const iv = crypto.getRandomValues(new Uint8Array(IV_LEN));
                const encrypted = await crypto.subtle.encrypt({ name: ALGO, iv, tagLength: 128 }, key, data);
                const result = new Uint8Array(IV_LEN + encrypted.byteLength);
                result.set(iv, 0);
                result.set(new Uint8Array(encrypted), IV_LEN);
                return result;
            }

            async function decryptFile(key, data) {
                if (data.length < IV_LEN) throw new Error('Data too short');
                const iv = data.slice(0, IV_LEN);
                const ciphertext = data.slice(IV_LEN);
                const decrypted = await crypto.subtle.decrypt({ name: ALGO, iv, tagLength: 128 }, key, ciphertext);
                return new Uint8Array(decrypted);
            }

            // ─── ADD FILES TO STATE ──────────────────────────────────
            function addFiles(fileList) {
                const newFiles = [];
                for (let i = 0; i < fileList.length; i++) {
                    const file = fileList[i];
                    let relPath = file.webkitRelativePath || file.name;
                    if (!relPath) continue;
                    relPath = relPath.replace(/\\/g, '/');
                    // Filter: only .txt or .json
                    const ext = relPath.split('.').pop().toLowerCase();
                    if (ext !== 'txt' && ext !== 'json') continue;
                    // Skip Banner folder (case-insensitive)
                    if (relPath.toLowerCase().includes('/banner/') || relPath.toLowerCase().startsWith('banner/')) continue;
                    // Skip if size zero? allow
                    newFiles.push({
                        file: file,
                        relPath: relPath,
                        size: file.size,
                        encrypted: null,
                        status: 'wait',
                    });
                }
                if (newFiles.length === 0) {
                    showToast('No valid .txt/.json files found (Banner skipped).', 'error');
                    return;
                }

                // Merge or replace duplicates by relPath
                const existingPaths = new Set(state.files.map(f => f.relPath));
                for (const nf of newFiles) {
                    if (existingPaths.has(nf.relPath)) {
                        // replace existing entry (keep same position)
                        const idx = state.files.findIndex(f => f.relPath === nf.relPath);
                        if (idx !== -1) {
                            state.files[idx] = nf;
                        } else {
                            state.files.push(nf);
                        }
                    } else {
                        state.files.push(nf);
                    }
                }

                // Recalculate totals
                state.totalBytes = state.files.reduce((sum, f) => sum + f.size, 0);
                state.encryptedCount = state.files.filter(f => f.status === 'ok').length;
                state.failedCount = state.files.filter(f => f.status === 'fail').length;

                updateStatsAndUI();
                updateProgress(0, state.files.length);
                progressFill.style.width = '0%';
                progressText.textContent = '0 / ' + state.files.length;
                progressPct.textContent = '0%';
                currentFile.innerHTML = '📄 <strong>' + state.files.length + ' files loaded</strong>';
                log('📂 Added ' + newFiles.length + ' file(s). Total: ' + state.files.length, 'log-info');
                showToast('✅ Added ' + newFiles.length + ' file(s)', 'success');
                btnEncrypt.disabled = false;
                btnDownload.disabled = true;
                btnVerify.disabled = true;
            }

            // ─── PROCESS FILES (ENCRYPT) ─────────────────────────────
            async function processFiles() {
                if (state.isEncrypting) return;
                const toProcess = state.files.filter(f => f.status !== 'ok');
                if (toProcess.length === 0) {
                    showToast('All files already encrypted.', 'success');
                    return;
                }

                state.isEncrypting = true;
                btnEncrypt.disabled = true;
                btnSelectFolder.disabled = true;
                btnSelectFiles.disabled = true;
                btnDownload.disabled = true;
                btnVerify.disabled = true;
                btnEncrypt.innerHTML = '<span class="spinner"></span> Encrypting...';

                let key;
                try {
                    key = await getCryptoKey();
                } catch (e) {
                    log('❌ Failed to derive key: ' + e.message, 'log-fail');
                    showToast('Key derivation failed', 'error');
                    state.isEncrypting = false;
                    btnEncrypt.innerHTML = '<span class="icon">🔐</span> Encrypt';
                    btnEncrypt.disabled = false;
                    btnSelectFolder.disabled = false;
                    btnSelectFiles.disabled = false;
                    return;
                }

                let processed = 0;
                let success = 0;
                let failed = 0;
                const total = state.files.length;

                // Reset status for files not ok
                for (const f of state.files) {
                    if (f.status !== 'ok') {
                        f.status = 'wait';
                        f.encrypted = null;
                    } else {
                        success++;
                    }
                }

                for (const f of state.files) {
                    if (f.status === 'ok') continue;
                    processed++;
                    try {
                        currentFile.innerHTML = '📄 <strong>' + escapeHtml(f.relPath) + '</strong>';
                        log('🔐 Encrypting: ' + f.relPath, 'log-info');
                        const fileData = await f.file.arrayBuffer();
                        const encrypted = await encryptFile(key, new Uint8Array(fileData));

                        // Verification
                        const decrypted = await decryptFile(key, encrypted);
                        const original = new Uint8Array(fileData);
                        if (decrypted.length !== original.length) throw new Error('Length mismatch');
                        for (let i = 0; i < original.length; i++) {
                            if (decrypted[i] !== original[i]) throw new Error('Byte mismatch at ' + i);
                        }

                        f.encrypted = encrypted;
                        f.status = 'ok';
                        success++;
                        log('✅ Verified OK: ' + f.relPath, 'log-ok');

                    } catch (e) {
                        f.status = 'fail';
                        f.encrypted = null;
                        failed++;
                        log('❌ Failed: ' + f.relPath + ' — ' + e.message, 'log-fail');
                    }

                    if (processed % 2 === 0 || processed === total) {
                        state.encryptedCount = success;
                        state.failedCount = failed;
                        updateStatsAndUI();
                        updateProgress(processed, total);
                        updateFileList();
                    }
                }

                state.encryptedCount = success;
                state.failedCount = failed;
                updateStatsAndUI();
                updateProgress(total, total);
                updateFileList();

                state.isEncrypting = false;
                btnEncrypt.innerHTML = '<span class="icon">🔐</span> Encrypt';
                btnEncrypt.disabled = false;
                btnSelectFolder.disabled = false;
                btnSelectFiles.disabled = false;

                if (failed === 0 && success > 0) {
                    btnDownload.disabled = false;
                    btnVerify.disabled = false;
                    log('🎉 All ' + success + ' files encrypted and verified!', 'log-ok');
                    showToast('✅ All files encrypted successfully!', 'success');
                } else if (success > 0) {
                    btnDownload.disabled = false;
                    btnVerify.disabled = false;
                    log('⚠️ Encrypted: ' + success + ' | Failed: ' + failed, 'log-fail');
                    showToast('⚠️ ' + success + ' OK, ' + failed + ' failed.', 'error');
                } else {
                    showToast('❌ Encryption failed for all files.', 'error');
                }
                currentFile.innerHTML = '📄 <strong>Done</strong>';
            }

            // ─── VERIFY ALL ──────────────────────────────────────────
            async function verifyAll() {
                if (state.isEncrypting) return;
                const toVerify = state.files.filter(f => f.encrypted && f.encrypted.length > 0);
                if (toVerify.length === 0) {
                    showToast('No encrypted data found. Encrypt first.', 'error');
                    return;
                }
                let key;
                try {
                    key = await getCryptoKey();
                } catch (e) {
                    showToast('Key derivation failed', 'error');
                    return;
                }
                let verified = 0,
                    failed = 0;
                log('🔍 Verifying ' + toVerify.length + ' encrypted files...', 'log-info');
                currentFile.innerHTML = '📄 <strong>Verifying...</strong>';
                for (const f of toVerify) {
                    try {
                        currentFile.innerHTML = '📄 <strong>' + escapeHtml(f.relPath) + '</strong>';
                        const original = await f.file.arrayBuffer();
                        const decrypted = await decryptFile(key, f.encrypted);
                        const orig = new Uint8Array(original);
                        if (decrypted.length !== orig.length) throw new Error('Length mismatch');
                        for (let i = 0; i < orig.length; i++) {
                            if (decrypted[i] !== orig[i]) throw new Error('Byte mismatch at ' + i);
                        }
                        f.status = 'ok';
                        verified++;
                        log('✅ Verified: ' + f.relPath, 'log-ok');
                    } catch (e) {
                        f.status = 'fail';
                        failed++;
                        log('❌ Verify failed: ' + f.relPath + ' — ' + e.message, 'log-fail');
                    }
                }
                state.encryptedCount = verified;
                state.failedCount = failed;
                updateStatsAndUI();
                updateFileList();
                if (failed === 0) {
                    showToast('✅ All ' + verified + ' files verified OK.', 'success');
                    log('🎉 All ' + verified + ' files verified successfully.', 'log-ok');
                } else {
                    showToast('⚠️ ' + verified + ' OK, ' + failed + ' failed.', 'error');
                    log('⚠️ Verified: ' + verified + ' | Failed: ' + failed, 'log-fail');
                }
                currentFile.innerHTML = '📄 <strong>Verify complete</strong>';
            }

            // ─── UI HELPERS ──────────────────────────────────────────
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function formatSize(bytes) {
                if (bytes === 0) return '0';
                const mb = bytes / (1024 * 1024);
                if (mb < 0.01) return '<0.01';
                return mb.toFixed(1);
            }

            function updateStatsAndUI() {
                const total = state.files.length;
                const enc = state.encryptedCount || 0;
                const fail = state.failedCount || 0;
                const totalBytes = state.files.reduce((sum, f) => sum + f.size, 0);
                statFound.textContent = total;
                statEncrypted.textContent = enc;
                statFailed.textContent = fail;
                statSize.textContent = formatSize(totalBytes);
                fileCountLabel.textContent = total > 0 ? total + ' file' + (total !== 1 ? 's' : '') + ' selected' :
                    'No files selected';
                if (total > 0) {
                    fileListCard.style.display = 'block';
                    fileListPill.textContent = total;
                } else {
                    fileListCard.style.display = 'none';
                }
                btnEncrypt.disabled = (total === 0 || state.isEncrypting);
                const hasEncrypted = state.files.some(f => f.encrypted && f.encrypted.length > 0);
                btnDownload.disabled = !hasEncrypted || state.isEncrypting;
                btnVerify.disabled = !hasEncrypted || state.isEncrypting;
                updateFileList();
            }

            function updateProgress(current, total) {
                const pct = total > 0 ? (current / total) * 100 : 0;
                progressFill.style.width = Math.min(pct, 100) + '%';
                progressText.textContent = current + ' / ' + total;
                progressPct.textContent = Math.round(Math.min(pct, 100)) + '%';
            }

            function updateFileList() {
                const wrap = fileListWrap;
                if (state.files.length === 0) {
                    wrap.innerHTML =
                        '<div style="padding:12px;text-align:center;color:var(--text-muted);font-size:0.7rem;">No files loaded</div>';
                    return;
                }
                let html = '';
                const maxShow = 100;
                const show = state.files.slice(0, maxShow);
                for (const f of show) {
                    const icon = f.status === 'ok' ? '✅' : f.status === 'fail' ? '❌' : '⏳';
                    const cls = f.status === 'ok' ? 'ok' : f.status === 'fail' ? 'fail' : 'wait';
                    const size = (f.size / 1024).toFixed(1) + ' KB';
                    html += '<div class="file-item">' +
                        '<span class="name">' + escapeHtml(f.relPath) + '</span>' +
                        '<span style="font-size:0.6rem;color:var(--text-muted);flex-shrink:0;margin:0 4px;">' + size +
                        '</span>' +
                        '<span class="status-icon ' + cls + '">' + icon + '</span>' +
                        '</div>';
                }
                if (state.files.length > maxShow) {
                    html += '<div class="file-item" style="color:var(--text-muted);font-style:italic;">… and ' +
                        (state.files.length - maxShow) + ' more</div>';
                }
                wrap.innerHTML = html;
            }

            // ─── DOWNLOAD ZIP ─────────────────────────────────────────
            function downloadZip() {
                const encryptedFiles = state.files.filter(f => f.encrypted && f.encrypted.length > 0);
                if (encryptedFiles.length === 0) {
                    showToast('No encrypted files to download.', 'error');
                    return;
                }
                const entries = [];
                for (const f of encryptedFiles) {
                    let path = f.relPath;
                    const lastDot = path.lastIndexOf('.');
                    if (lastDot > 0) path = path.substring(0, lastDot) + '.dat';
                    else path = path + '.dat';
                    entries.push({ path, data: f.encrypted });
                }
                try {
                    const zipData = generateZip(entries);
                    const blob = new Blob([zipData], { type: 'application/zip' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'JinendraVani_Assets.zip';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                    showToast('📦 Downloading ' + entries.length + ' files...', 'success');
                    log('📦 Downloaded ZIP with ' + entries.length + ' encrypted files.', 'log-info');
                } catch (e) {
                    showToast('ZIP generation failed: ' + e.message, 'error');
                    log('❌ ZIP error: ' + e.message, 'log-fail');
                }
            }

            // ─── CLEAR ────────────────────────────────────────────────
            function clearAll() {
                if (state.isEncrypting) return;
                state.files = [];
                state.encryptedCount = 0;
                state.failedCount = 0;
                state.totalBytes = 0;
                state.key = null;
                state.keyRaw = null;
                updateStatsAndUI();
                updateProgress(0, 0);
                progressFill.style.width = '0%';
                progressText.textContent = '0 / 0';
                progressPct.textContent = '0%';
                currentFile.innerHTML = '📄 <strong>Ready</strong>';
                statusLog.innerHTML = '';
                fileListWrap.innerHTML =
                    '<div style="padding:12px;text-align:center;color:var(--text-muted);font-size:0.7rem;">No files loaded</div>';
                fileListCard.style.display = 'none';
                btnEncrypt.disabled = true;
                btnDownload.disabled = true;
                btnVerify.disabled = true;
                btnEncrypt.innerHTML = '<span class="icon">🔐</span> Encrypt';
                showToast('🧹 Cleared all data', '');
                log('🧹 Cleared all data.', 'log-dim');
            }

            // ─── INIT ──────────────────────────────────────────────────
            async function init() {
                try {
                    await getCryptoKey();
                    log('🔑 Key derived successfully (SHA-256).', 'log-info');
                } catch (e) {
                    log('⚠️ Key derivation pre-check failed: ' + e.message, 'log-fail');
                }

                btnSelectFolder.addEventListener('click', () => { if (!state.isEncrypting) folderInput.click(); });
                btnSelectFiles.addEventListener('click', () => { if (!state.isEncrypting) fileInput.click(); });

                folderInput.addEventListener('change', (e) => {
                    if (e.target.files.length) {
                        addFiles(e.target.files);
                        e.target.value = '';
                    }
                });
                fileInput.addEventListener('change', (e) => {
                    if (e.target.files.length) {
                        addFiles(e.target.files);
                        e.target.value = '';
                    }
                });

                btnEncrypt.addEventListener('click', processFiles);
                btnDownload.addEventListener('click', downloadZip);
                btnVerify.addEventListener('click', verifyAll);
                btnClear.addEventListener('click', clearAll);

                updateStatsAndUI();
                updateProgress(0, 0);
                log('🟢 Ready. Select a folder or individual files.', 'log-info');

                if (!window.crypto || !window.crypto.subtle) {
                    log('❌ Web Crypto API not available.', 'log-fail');
                    showToast('Web Crypto API not available', 'error');
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
